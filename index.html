
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KataJual AI - Product Marketing Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#182238}
header{background:#17243b;color:white;padding:20px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold;color:#a8d5ff}
.hero{text-align:center;padding:48px 18px 25px}
.hero h1{font-size:34px;margin-bottom:12px}
.hero p{color:#64748b;line-height:1.6}
main{max-width:720px;margin:20px auto 60px;padding:0 16px}
.panel{background:white;padding:25px;border-radius:16px;box-shadow:0 5px 25px #17243b12}
label{display:block;font-weight:bold;margin:16px 0 8px}
input,textarea,select{width:100%;padding:13px;border:1px solid #d8deea;border-radius:9px;font-size:15px;background:white}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:9px;padding:14px 18px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.generate{width:100%;margin-top:22px;background:#2563eb;color:white;font-size:16px}
.result{margin-top:20px;background:#f2f6ff;padding:18px;border-radius:10px;display:none;white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
.copy{background:#e1eaff;color:#1746a0;margin-top:10px}
footer{text-align:center;padding:25px;color:#718096;font-size:13px}
@media(max-width:500px){.hero h1{font-size:27px}.grid{grid-template-columns:1fr}.panel{padding:18px}}
</style>
</head>
<body>

<header>
<div class="logo">✦ KataJual AI</div>
<span>EN | ID</span>
</header>

<section class="hero">
<h1>Create better product descriptions with AI.</h1>
<p>Generate product titles, descriptions and marketing captions in seconds.</p>
</section>

<main>
<div class="panel">
<h2>Product information</h2>

<label>Product name</label>
<input id="product" placeholder="e.g. Running Shoes" maxlength="150">

<label>Product features</label>
<textarea id="features" placeholder="Describe the product features..." maxlength="800"></textarea>

<label>Target audience</label>
<input id="audience" placeholder="e.g. Young adults" maxlength="150">

<div class="grid">
<div>
<label>Language</label>
<select id="language">
<option>English</option>
<option>Indonesian</option>
</select>
</div>
<div>
<label>Tone</label>
<select id="tone">
<option>Persuasive</option>
<option>Professional</option>
<option>Friendly</option>
<option>Luxury</option>
</select>
</div>
</div>

<button id="generateButton" class="generate" onclick="generate()">✦ Generate content</button>

<div id="result" class="result"></div>

<button id="copy" class="copy" style="display:none" onclick="copyResult()">Copy result</button>
</div>
</main>

<footer>© 2026 KataJual AI. All rights reserved.</footer>

<script>
async function generate() {
  const product = document.getElementById("product").value.trim();
  const features = document.getElementById("features").value.trim();
  const audience = document.getElementById("audience").value.trim();
  const language = document.getElementById("language").value;
  const tone = document.getElementById("tone").value;

  const result = document.getElementById("result");
  const copyButton = document.getElementById("copy");
  const generateButton = document.getElementById("generateButton");

  if (!product || !features) {
    alert("Please enter the product name and features.");
    return;
  }

  const benefits = audience
    ? features + "\nTarget audience: " + audience
    : features;

  result.style.display = "block";
  copyButton.style.display = "none";
  result.textContent = "Generating your content with AI. Please wait...";
  generateButton.disabled = true;
  generateButton.textContent = "Generating...";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        product: product,
        benefits: benefits,
        tone: tone,
        language: language
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed.");
    }

    if (!data.result) {
      throw new Error("AI returned an empty response.");
    }

    result.textContent = data.result;
    copyButton.style.display = "inline-block";

  } catch (error) {
    result.textContent = "Sorry, something went wrong.\n\n" + error.message;
  } finally {
    generateButton.disabled = false;
    generateButton.textContent = "✦ Generate content";
  }
}

async function copyResult() {
  const text = document.getElementById("result").textContent;

  try {
    await navigator.clipboard.writeText(text);
    alert("Copied!");
  } catch (error) {
    alert("Please select and copy the result manually.");
  }
}
</script>

</body>
</html>
